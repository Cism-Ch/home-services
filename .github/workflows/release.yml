name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    name: Validate and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static Security & Pure ASCII Audit
        run: python evals/security_audit.py

      - name: RSI Guardrails Integrity Verification
        run: python evals/rsi_orchestrator.py --guardrail

      - name: Run Full Deterministic Evaluation
        run: python evals/run_fullstack_eval.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
