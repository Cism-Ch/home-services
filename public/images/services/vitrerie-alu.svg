<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <!-- Modern interior backdrop -->
  <rect x="110" y="85" width="580" height="275" rx="18" fill="#F4F6F9"/>
  <line x1="90" y1="360" x2="710" y2="360" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <!-- Aluminum & glass sliding partition frame -->
  <rect x="200" y="122" width="400" height="238" rx="10" fill="#FFFFFF" stroke="#232730" stroke-width="8"/>
  <!-- Glass panels -->
  <rect x="214" y="136" width="122" height="210" fill="#E8F1FA"/>
  <rect x="344" y="136" width="122" height="210" fill="#DCEAF7"/>
  <rect x="474" y="136" width="112" height="210" fill="#E8F1FA"/>
  <!-- Aluminum mullions -->
  <rect x="336" y="126" width="8" height="230" fill="#232730"/>
  <rect x="466" y="126" width="8" height="230" fill="#232730"/>
  <!-- Glass reflection diagonals -->
  <line x1="236" y1="185" x2="274" y2="147" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="215" x2="292" y2="159" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="366" y1="195" x2="414" y2="147" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="496" y1="185" x2="534" y2="147" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Coral-orange sliding handle & suction lifter badge -->
  <rect x="352" y="224" width="10" height="42" rx="5" fill="#FF6B4A"/>
  <circle cx="530" cy="245" r="24" fill="#FF6B4A" fill-opacity="0.18"/>
  <circle cx="530" cy="245" r="10" fill="#FF6B4A"/>
</svg>
